<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZandEx Africa</title><style>
:root{--o:#e86500;--n:#22130e;--p:#f5f1ec;--l:#ded4cb;--g:#176b50}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--n);font:14px Segoe UI,Arial,sans-serif}.top{height:62px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 24px;gap:14px}.brand{font:700 22px Georgia;color:var(--o)}.brand small{font:10px Segoe UI;letter-spacing:1px}.hamb{display:none;border:1px solid var(--l);background:#fff;padding:8px;border-radius:6px;font-size:19px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}aside{background:var(--n);padding:17px 12px;color:#f6dec7}.office{padding:11px;border-left:3px solid var(--o);background:#321b13;font-size:12px;line-height:1.5}.nav-title{font-size:10px;letter-spacing:1px;color:#bd9477;margin:18px 9px 5px}nav button{display:block;width:100%;text-align:left;padding:9px;border:0;border-radius:5px;background:transparent;color:#f2d9c4;cursor:pointer}nav button:hover,nav button.active{background:#4b2617;color:#fff;border-left:3px solid var(--o)}main{padding:26px;max-width:1450px;width:100%}.eyebrow{font-size:10px;letter-spacing:1.4px;color:var(--o);font-weight:bold}h1{font:500 27px Georgia;margin:5px 0}p{color:#74675f;margin:0 0 19px}.metrics{display:grid;grid-template-columns:1.6fr repeat(3,1fr);border:1px solid var(--l);background:#fff}.metric{padding:17px;border-right:1px solid var(--l)}.metric:last-child{border:0}.metric small{display:block;color:#74675f;font-size:10px}.metric b{font:500 25px Georgia}.money{background:var(--n);color:#fff}.money small{color:#dec6b7}.money b{font-size:32px}.panel{margin-top:18px;background:#fff;border:1px solid var(--l)}.panelhead{padding:15px 18px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.panelhead b{font-size:16px}button{font:inherit;cursor:pointer}.primary{background:var(--o);color:#fff;border:0;border-radius:5px;padding:10px 13px;font-weight:bold}.table{border-collapse:collapse;width:100%}.table th,.table td{text-align:left;padding:12px 18px;border-bottom:1px solid #eee9e4}.table th{font-size:10px;color:#74675f}.table td:last-child,.table th:last-child{text-align:right}.notice{padding:12px 18px;background:#fff5e6;color:#795421;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto}.dialog header,.dialog footer{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid var(--l)}.dialog footer{border-top:1px solid var(--l);border-bottom:0;justify-content:flex-end;gap:8px}.dialog h2{margin:0;font-size:17px}.body{padding:18px 20px}.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.fields label,.sale-line label{font-size:10px;color:#74675f;font-weight:bold}.fields input,.fields select,.sale-line input,.sale-line select{display:block;width:100%;margin-top:4px;padding:8px;border:1px solid var(--l);border-radius:4px;font:inherit}.sale-line{display:grid;grid-template-columns:1.4fr .65fr .8fr .8fr 31px;gap:8px;align-items:end;padding:9px 0;border-bottom:1px solid #eee9e4}.remove{background:#f4e7e2;border:0;color:#b6362e;padding:8px}.total{display:flex;justify-content:space-between;padding:14px 0;font-weight:bold}.empty{padding:34px;text-align:center;color:#74675f}@media(max-width:800px){.shell{display:block}aside{position:fixed;left:0;top:62px;bottom:0;width:255px;transform:translateX(-100%);transition:.18s;z-index:2}.shell.menu aside{transform:none}.hamb{display:block}main{padding:18px}.metrics{grid-template-columns:1fr 1fr}.metric{border-bottom:1px solid var(--l)}.money{grid-column:1/-1}.sale-line{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr 1fr}.table th:nth-child(3),.table td:nth-child(3){display:none}}@media(max-width:430px){.fields{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.money{grid-column:auto}.table th:nth-child(2),.table td:nth-child(2){display:none}}
</style><body><header class="top"><button class="hamb" onclick="document.querySelector('.shell').classList.toggle('menu')">☰</button><div class="brand">ZandEx <small>AFRICA · GESTION</small></div><span style="margin-left:auto;color:#74675f;font-size:12px">Bureau principal · Kinshasa</span></header><div class="shell"><aside><div class="office"><b>BUREAU PRINCIPAL</b><br>Journée ouverte · 24 septembre</div><nav><div class="nav-title">PILOTAGE</div><button class="active" data-p="dashboard">◉ Tableau de bord</button><button data-p="reports">▤ Rapports journaliers</button><div class="nav-title">OPÉRATIONS</div><button data-p="stock">□ Stock & mouvements</button><button data-p="agents">♙ Agents terrain</button><button data-p="sales">↗ Ventes & encaissements</button><button data-p="purchases">↓ Achats</button><div class="nav-title">FINANCES</div><button data-p="cash">◈ Trésorerie</button><button data-p="expenses">− Dépenses</button><button data-p="inventory">≡ Inventaires</button></nav></aside><main id="main"></main></div><div class="modal" id="report"><div class="dialog"><header><h2>Rapport journalier d’un agent</h2><button onclick="closeReport()">×</button></header><div class="body"><p>Ajoutez autant de produits vendus que nécessaire. Une seule validation crée le rapport complet.</p><div class="fields"><label>Agent<select><option>Clarisse M.</option><option>Jesse B.</option><option>David K.</option></select></label><label>Date<input type="date" value="2026-09-24"></label><label>Montant remis (FC)<input type="number" value="0"></label></div><h3 style="font-size:13px;margin:20px 0 4px">Produits vendus</h3><div id="lines"></div><button class="primary" onclick="addLine()">+ Ajouter un produit</button><div class="total"><span>Total des ventes</span><span id="total">0 FC</span></div></div><footer><button onclick="closeReport()">Annuler</button><button class="primary" onclick="saveReport()">Valider le rapport</button></footer></div></div><script>
const M=document.getElementById('main'),pages={stock:['Stock & mouvements','Réception, distribution, ravitaillement et retours.','Nouveau mouvement'],agents:['Agents terrain','Stock confié, ventes et performance par agent.','Nouvel agent'],sales:['Ventes & encaissements','Ventes directes du bureau et ventes terrain.','Nouvelle vente'],purchases:['Achats','Achats fournisseurs et entrée en stock.','Nouvel achat'],cash:['Trésorerie','Encaissements, dépenses, versements et solde journalier.','Nouveau mouvement'],expenses:['Dépenses','Dépenses de bureau et frais terrain.','Nouvelle dépense'],inventory:['Inventaires','Stock théorique comparé au stock physique.','Nouvel inventaire'],reports:['Rapports journaliers','Rapports d’agents avec plusieurs produits vendus.','+ Saisir un rapport agent']};function dashboard(){M.innerHTML=`<div class="eyebrow">CENTRE DE CONTRÔLE OPÉRATIONNEL</div><h1>Situation du bureau</h1><p>Suivi en temps réel des marchandises, agents et trésorerie.</p><section class="metrics"><div class="metric money"><small>TRÉSORERIE DISPONIBLE</small><b>1 284 000 FC</b></div><div class="metric"><small>VENTES TERRAIN</small><b>1 230 000 FC</b></div><div class="metric"><small>STOCK BUREAU</small><b>482 u.</b></div><div class="metric"><small>CHEZ LES AGENTS</small><b>196 u.</b></div></section><section class="panel"><div class="panelhead"><b>Dernières opérations</b><span>Journal de traçabilité</span></div><table class="table"><tr><th>OPÉRATION</th><th>RESPONSABLE</th><th>MONTANT / QUANTITÉ</th></tr><tr><td>Rapport validé · Clarisse M.</td><td>Marie K.</td><td>+ 186 000 FC</td></tr><tr><td>Ravitaillement · Jesse B.</td><td>Marie K.</td><td>20 unités</td></tr></table></section>`}function page(key){const [title,text,action]=pages[key];M.innerHTML=`<div class="eyebrow">MODULE OPÉRATIONNEL</div><h1>${title}</h1><p>${text}</p><section class="panel"><div class="panelhead"><b>${title}</b><button class="primary" id="action">${action}</button></div><div class="notice">Chaque action validée est enregistrée dans le journal de traçabilité.</div><table class="table"><tr><th>RÉFÉRENCE</th><th>DATE</th><th>STATUT</th></tr><tr><td>Dernière opération</td><td>Aujourd’hui</td><td>Confirmée</td></tr><tr><td>Historique associé</td><td>Hier</td><td>Validé</td></tr></table></section>`;document.getElementById('action').onclick=()=>key==='reports'?openReport():alert('Le formulaire « '+action+' » est prêt à être relié aux données du module.')}function openReport(){document.getElementById('report').classList.add('show');if(!document.querySelector('.sale-line'))addLine()}function closeReport(){document.getElementById('report').classList.remove('show')}function addLine(){document.getElementById('lines').insertAdjacentHTML('beforeend',`<div class="sale-line"><label>Produit<select onchange="sync(this);calc()"><option value="15500">Détergent Citrus 1L</option><option value="9000">Savon liquide 500 ml</option><option value="7000">Gel désinfectant 250 ml</option></select></label><label>Quantité<input class="qty" type="number" min="1" value="1" oninput="calc()"></label><label>Prix unitaire<input class="price" type="number" value="15500" oninput="calc()"></label><label>Réduction<input class="disc" type="number" value="0" oninput="calc()"></label><button class="remove" onclick="this.parentElement.remove();calc()">×</button></div>`);calc()}function sync(e){e.closest('.sale-line').querySelector('.price').value=e.value}function calc(){let n=0;document.querySelectorAll('.sale-line').forEach(x=>n+=(+x.querySelector('.qty').value||0)*(+x.querySelector('.price').value||0)-(+x.querySelector('.disc').value||0));document.getElementById('total').textContent=new Intl.NumberFormat('fr-FR').format(n)+' FC'}function saveReport(){const n=document.querySelectorAll('.sale-line').length;if(!n)return alert('Ajoutez au moins un produit.');closeReport();alert('Rapport enregistré avec '+n+' produit(s) vendu(s).');page('reports')}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('.shell').classList.remove('menu');b.dataset.p==='dashboard'?dashboard():page(b.dataset.p)});dashboard();
</script></body></html>
