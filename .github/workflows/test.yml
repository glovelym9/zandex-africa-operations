name: Verify ZandEx core
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test zandex-core.test.js form-actions.test.js
