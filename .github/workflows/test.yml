name: Verify ZandEx application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:core
      - run: node --test form-actions.test.js
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/zandex
